name: secret-scan

# Required check (Phase 03). TruffleHog (open source) on the commits this PR adds, verified
# secrets only (--only-verified). Not gitleaks-action: it needs a paid licence for org accounts.
# A verified secret fails the job. No continue-on-error.

on:
  pull_request:
    branches: [integration, master, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog (PR diff, verified only)
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified
